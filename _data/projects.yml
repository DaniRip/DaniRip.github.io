- title: "Generative Inverse Optimization"
  category: "active"
  description: "Generative AI has swept the nation, in many ways leaving traditional optimization behind. However, it ironically borrows heavily from the optimization toolbox.<br>In this project, we look to generate models from large datasets, in a similar fashion to AI. Unlike AI, however, we will be working with datasets that form optimization problems and learning those instead.<br>Through this project, we hope to learn more about the overlap between modern-day AI and OR, and how the two fields can continue to build each other up over time."
  gallery:
      - type: image
        url: "/assets/GenerativeInverse.png"  

- title: "Learning to Pivot (SimplexRL)"
  category: "active"
  description: "The simplex method's speed depends on which pivot it takes at each step, and classical rules choose by fixed local formulas. In this project, led by Felix Parker with Emmett Springer and Kimia Ghobadi, we model pivot selection as a sequential decision problem, use exact search to find the shortest routes, and train policies to follow them.<br>An early learned policy already ties steepest edge on a 40 x 40 test problem. See the pivot timeline in action in my <a href='/talks/walking-the-corners/' target='_blank'>Walking the Corners</a> lecture."
  gallery:
      - type: image
        url: "/assets/SimplexRL_timeline.jpg"

- title: "The Impact of AI Scribes on Primary Care Practitioners"
  category: "active"
  description: "AI scribe technology has been rapidly deployed in practitioners' offices in the past year or two, but the studies in terms of efficacy and where it is and isn't helpful are just catching up. We are working on one of these studies!"
  gallery:    
      - type: image
        url: "/assets/AIScribe.png"

- title: "The Homecare Provider Allocation Problem"
  category: "active"
  description: "Dispatching home care workers to patients is a natural problem for operations research, in that it is difficult, multistage and data-intensive. In this project, we look for ways to make this very large problem tractable and adjustable for non-expert users that will be using the end-systems."
  gallery:
      - type: image
        url: "/assets/CoCMypall_hcp_routes_iter10n2_t0.png"         

- title: "Incorporating Robustness into Radiation Therapy Treatment Planning"
  category: "active"
  description: "When planning radiation therapy plans, or optimizing in general, the greediness of the underlying algorithms can have negative impacts on plan selection. In this multi-year body of work, we investigate the interplay between very large models and uncertainty, studying which kinds of approaches are best to mitigate uncertainty in various scenarios."
  gallery:
      - type: image
        url: "/assets/RobustUncertainty.png"  

- title: "Geometric Beam Angle Optimization"
  category: "active"
  description: "When clinicians plan radiation therapy treatment plans for step-and-shoot radiation therapy, the beam angles must be chosen before any calculation can be made. These angles are often selected to be equidistant, due to the difficulty in determining the best angles <em>a priori</em>. The literature has employed heuristic approaches that have been shown to work better than this naive equidistant approach. However, what if there were more knowledge-based approaches to doing so?"
  gallery:
      - type: image
        url: "/assets/3D_RotatingPros.webp"      

- title: "Radiation Therapy Sampling and Solution Pipeline/Add-On"
  category: "completed"
  description: "A MATLAB-based codebase that takes in matRad-calculated dose objects, allows for multiple sampling modalities, and then connects to a CPLEX-c++ solver for optimization.<br>We used it to compare eight voxel sampling approaches on clinical cases, published in <a href='https://doi.org/10.1002/mp.70179' target='_blank'>Medical Physics</a> (2025)."
  repo: "https://github.com/DaniRip/RT_Sampling_Pipeline"
  gallery:
    - type: image
      url: "https://github.com/DaniRip/RT_Sampling_Pipeline/blob/master/sampleOutputs/GUIloaded2.png?raw=true"

- title: "Robust Direct Aperture Optimization"
  category: "completed"
  description: "Radiation therapy plans are usually built in stages: doses first, then the aperture shapes the machine delivers, which can cost plan quality. Robust direct aperture optimization does both at once and protects the plan against breathing motion, in a single mixed-integer model that includes the machine's deliverability rules. To make it solvable, I designed a candidate plan generation heuristic that quickly produces clinically viable plans and warm-starts the full model.<br>Published in the <a href='https://doi.org/10.1287/ijoc.2022.1167' target='_blank'>INFORMS Journal on Computing</a> (2022), with T. G. Purdie, T. C. Y. Chan and H. Mahmoudzadeh."
  gallery:
    - type: image
      url: "/assets/RDAO_apertures.png"

- title: "morDiRECT: An interface for comparing tradeoffs in radiation therapy treatment planning"
  category: "completed" 
  description: "This paper took a preliminary look at how to handle black-box multi-objective problems, with the specific use case of stereotactic radiosurgery planning.<br>Conceptually, the interface took the idea of multi-objective trade-offs and used this as an engine for delivering plan alternatives to the end user. The interface facilitated in-depth trade-off analysis between a set of plans that were prerun, for greater flexibility and an intuitive understanding of the decision space.<br>Published in <a href='https://doi.org/10.1016/j.eswa.2015.06.028' target='_blank'>Expert Systems with Applications</a> (2015), with D. M. Aleman and K. Ghobadi."
  gallery:
    - type: image
      url: "/assets/Gui11.png"

