- title: "Incorporating Robustness into Radiation Therapy Treatment Planning"
  category: "active"
  description: "When planning radiation therapy plans, or optimizing in general, the greediness of the underlying algorithms can have negative impacts on plan selection. In this multi-year body of work, we investigate the interplay between very large models and uncertainty, studying which kinds of approaches are best to mitigate uncertainty in various scenarios."
      - type: image
        url: "/assets/3D_RotatingPros.gif"  

- title: "Geometric Beam Angle Optimization"
  category: "active"
  description: "When clinicians plan radiation therapy treatment plans, in step-and-shoot radiation therapy, the beam angles must be chosen before any calculation can be made. These are often selected to be equidistant, due to the difficulty in determining the best angles *a-priori*. The literature has employed heuristic approaches that have been shown to work better. However, what if there were more knowledge-based approaches to doing so?"
      - type: image
        url: "/assets/3D_RotatingPros.gif"      

- title: "Radiation Therapy Sampling and Solution Pipeline/Add-On"
  category: "completed"
  description: "A MATLAB-based codebase that takes in matRad-calculated dose objects, allows for multiple sampling modalities, and then connects to a CPLEX-c++ solver for optimization."
  repo: "https://github.com/DaniRip/RT_Sampling_Pipeline"
  gallery:
    - type: image
      url: "https://github.com/DaniRip/RT_Sampling_Pipeline/blob/master/sampleOutputs/GUIloaded2.png?raw=true"

- title: "morDiRECT: An interface for comparing tradeoffs in radiation therapy treatment planning"
  category: "completed" 
  description: "This paper took a preliminary looked at how to handle blackbox multi-objective problems, with the specific usecase of stereotactic radiosurgery planning.<br>Conceptually, the interface took the idea of mult-objective tradeoffs and used this as an engine for delivering plan alternatives to the end user. The interface facilitated in depth trade-off analysis between a set of plans that were prerun, for greater flexibility and an intuitive understanding of the decision space."
  gallery:
    - type: image
      url: "/assets/Gui11.png"

- title: "Simple PLINKO Game"
  category: "fun"
  description: "Inspired by the Price is Right minigame, I used this simple, visual R program to simulate one or multiple games of PLINKO for statistics students at the University of Waterloo.<br>Since Markov chains are slightly out of scope of the course, we focus on the binomial distribution and the similarities and differences that come from that. Note, this application allows for non-standard board generations, which makes this teaching process easier. Message me to connect if you would like a copy of the labs!"
