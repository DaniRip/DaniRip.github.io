- title: "Simple PLINKO Game"
  category: "fun"
  description: "Inspired by the Price is Right minigame, I used this simple, visual R program to simulate one or multiple games of PLINKO for statistics students at the University of Waterloo.<br>Since Markov chains are slightly out of scope of the course, we focus on the binomial distribution and the similarities and differences that come from that. Note, this application allows for non-standard board generations, which makes this teaching process easier. Message me to connect if you would like a copy of the labs!"
  repo: "https://github.com/DaniRip/Simple_Plinko"
  gallery:
