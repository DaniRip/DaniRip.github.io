- title: "Recycling Sorter"
  category: "fun"
  description: "Back in 2012, I was in Mechanical Engineering and Yuhin Wu, Ryan Brown, Keith Tong and I spent many a late night at Skule\u2122 building ART: the automated recycling terminal. ART was an Arduino-based recycling sorter for ASME's SEC competition (and we won the local competition!). We were all very young here. <br>If you pay attention to the bottles in the videos, you might notice they break most conventional sorting mechanisms -- this was not an accident! Can you tell how the machine works?"
