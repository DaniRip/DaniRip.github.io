- organization: "Scientific Peer Review"
  role: "Technical Reviewer"
  description: |
    Invited reviewer for international journals in Operations Research and Healthcare Engineering. Responsible for evaluating the methodological rigor, original contribution, and technical accuracy of submitted manuscripts. Trying not to be reviewer 2.
  journals:
    - "Medical Physics"
    - "Operations Research Forum"
    - "International Transactions in Operational Research"
    - "Computers and Operations Research"
    - "European Journal of Operational Research"
    - "Quantitative Imaging in Medicine and Surgery"

- organization: "Canadian Operations Research Society (CORS)"
  role: "National Student Councillor (2024–2025)"
  description: |
    Elected to represent the national student body, spearheading the post-pandemic reinvigoration of student chapters across Canada. Previously served in multiple leadership tiers, including <b>President of University of Waterloo's Student Chapter</b>. Led local membership growth by 200%, transitioned on-boarding processes, and managed digital presence over seven years.
  
- organization: "The Operations Research Challenge (TORCH)"
  role: "Founder & Competition Chair"
  description: |
    Founded and directed the University of Waterloo branch of this tri-university high school outreach competition. Oversaw the end-to-end development of contest mathematics, automated validators, and administrative infrastructure. Previously served as a long-term Executive at the University of Toronto branch, designing curriculum to introduce OR concepts to secondary students, in a fun, single-day, collaborative format. Raised and distributed thousands of dollars in prize money. Led the 2018 and 2019 competitions; the 2020 competition was cancelled due to the pandemic, and the competition has been dormant since.

- organization: "Conference Service & Digital Design"
  role: "Designer / Volunteer"
  description: |
    Collaborated with <a href="https://www.linkedin.com/in/kieferburgess" target="_blank">Dr. Kiefer Burgess</a> on the architectural design of the virtual "Conference Centre" for CORS 2021 using Gather Town, creating an immersive digital environment for academic exchange during the pandemic. Session chair and volunteer at the <a href="https://connect.informs.org/computing/home" target="_blank">INFORMS Computing Society (ICS)</a> conference (2025; <em>Data-Driven Optimization in Healthcare</em>), and session chair at the CORS/INFORMS International Conference (2022).
  images:
    - src: "/assets/MainGatherRoom.png"
      alt: "Main Gather Room"
    - src: "/assets/BeachArea.png"
      alt: "Beach Area in Gather Town"

- organization: "Management Sciences Student Association (MSSA)"
  role: "Departmental Representative / President (2016-2017)"
  description: |
    Elected representative for the graduate student body at the University of Waterloo. Managed departmental budgets, facilitated faculty-student communication channels, and organized a series of invited speaker seminars and professional development socials.
